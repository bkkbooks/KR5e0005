front:
  text: 太上靈寳淨明洞神上品經卷上
  hash: sha256:6f164a1f9e002ee28a31c765aa2b24e4cb312048f96ee850775a0d6178d13683
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5e0005_HFL_001-001a, image: hfl/0756/0756-008.png}
body:
  text: 无上始青篇第一太極无上大羅始青中有真人不死不生天中之尊是名三清玉清宮中元始天尊上清宫中靈寳天尊太清宮中道德天尊是為三景各有真人為之典丞左右丞相玉童玉女典經典吏掌籍學士釋文謄籍法官御史中丞緫領宇宙主宰之君是為玉皇承三清之命察紫微之庭侍衛之官承受二清紫微之庭樞紐百靈小事專掌大事申呈玉皇之宮以定章程執事之臣上應三清外有加貟一一有名南北二斗生殺之君左有太微右少微君玄都主判天樞紀綱七十四司喉舌之官都録録事紏察善良名曰㑹府尚書五部太微少微玄都宰主是為三省是為六曹行壇判官亦如前數知其名位可以覺悟修吾道者可應貟數參侍玉宸三五飛歩天官列次篇第二大道統御森列天官天官之星朝迎帝郷修吾道者上達玉皇名位若此超俗離常或以文品或以武官左右朝列金佩珠璫參玉帝之輿侍紫微之傍或以官署諸天丞相左日右月之曹屬二十八宿之掾官皆名真人得歩流綱黄白黒道必識其機知吾道者可平歩雲飛何名金公何名木妻修真錬炁以得玄微倬倬孝弟忠義不虧雖无大藥亦可以悟法名列巍巍或行符呪水給藥度危是為下品皆未若吾以孝弟而服炁事雙親養一身不尸解即超真此孝道服錬所以列次於天人天人非難人自難之為仙之非難則不危其身不忤其親所以善濟於人不治身不事親是曰貧而欲黄金天官列次不易書名不難書名不難不易至道之精若夫朝禮求神此未易明而皆出於錬形入道真品篇第三人之初生父母遺體知其所養知其所貴知其所事父母之身天尊之身能事父母天尊降靈欲拜星辰友恭弟兄兄弟之身諸天真人凡知此者可以燒丹篆符百鬼畏名不能此者未可入道以奉三清夜叉食其肉魔刹戮其神雖有丹書萬卷未可以昇真符篆萬篋未可以役鬼神百魔萬怪一切妖精皆笑而欲吞噬之及其死也酆都考戮百斷千刑刑之又刑安有魂神南宫上仙惡聞其名掩鼻塞耳切齒不聽唯知忠孝可以學道道甚易知不為難也悔悟學道是為上善不孝為孝可全至孝至孝非難過而即攺前日犯親不敢再犯今日之後誓以不犯如此則上帝遣真人降於世授之真訣修身濟物積行以為仙不悟此則是无筏而欲濟永劫輪轉沈於下鬼者也入道修巳篇第四夫道甚夷未嘗不易迷於向背遂隔流綱爰有入道之序兹為棄俗之門固有父母同升夫妻同列愛身行孝惟以為忠本自性根固於山岳凡夫揺蕩遂此顚危輕於養炁昧於事親元炁淪亡大恩泯絶又安能事於君上而自棄於帝𠂻所以罪積如江河冥官考覈者也凡我赤子願聽我言我如欺君使我雙目盲兩耳聾鼻塞口喑手足不仁不履帝庭不上昇雲億千萬世酆都考形但願我赤子孝順長在心居家奉父母在朝忠於君不為貪滛行泄散精與神福來如流泉𣲖𣲖自然明日夜念此經魂炁自然靈或有骨肉災病者自然平或薦諸魂爽滯魄脫幽冥念念天尊力天尊度世人世人昧生理五逆存於心心旣存五逆天尊淚如傾天尊非棄汝汝可察我誠修己奉教篇第五紏察三界五岳三官日遊神君十天魔王緫簿罪福天樞都録佐有七人統七十四貟之曹屬无大不載无細不遺三元三㑹申呈南北之司南北定其輕重以上紫微其小者送于二十八宿十二宫辰三十二天同為别明大則玉皇專達或處斷于三清如鏡之明如水之平修吾道者持戒而成旣以事親為骨髓錬形為皮肉救度如毛髮功德為衣服如有貪財貪色隂險巨毒推而下之心貪食肉他人之財如君王之粟汝不可私蓄他人之妻女如己之母女汝不可滛欲他人之善汝敬事而不可𢡖毒下至百獸與夫六畜各念之如子忍食其肉是以我願學仙真童十善具足全兹五福生為陸地仙死入黄金屋不食煙火不食五穀魂在朱陵受煉停蓄履兹玉虚神仙為屬奉教修真篇第六學道有基昇仙有梯必知袐訣方達玄微身乃无所愧心則无所疑无為寂寞夜冥静思五臟神君一一騰飛上造天樞㑹要之司過旣无有功亦可知晝服日精夜餐月液魂魄澄錬自然有益飛神三五上朝天極自然名達天魁南北之君以子之名以子之身引見于宸庭天門不敢逆天樞百僚迎以此上蒙巨福而後下積元功書符召雨叱咤雲風生則遥授真職死則正入仙宗不墜惡道不係幽司身為上天真宰管勾下界攸司上光九祖亦登天倪下廕九孫皆有仙資不受凍餒自然福隨无以吾言祕不使人知教我赤子各攺是以去非念誦此經以上昇真或為國王帝主上消兵戈或為父母兄弟親屬預種宿縁或為死者以度尸形皆得如意以從爾心爾心不退可以學道學道之子謹奉吾教昇真識神篇第七學道昇真乗雲飛昇天書來降仙官奉迎仙官為誰諸位真人雙龍御車力士捧節前呵後衛大力天丁玉童玉女執綬執印銀璫小臣口傳帝命於此无悸於此无驚自然魂魄受錬未陵朱陵大將流金火鈴入天之界天有四門東華之門門管之司中有主宰日直元君中有主判録事尊神中有主閽金剛力士三位真仙問子名字考汝罪犯第汝功績不謬不錯子方可入録事二人引子上昇南斗北斗各有真君録事旣退真君奉迎次第奏達紫微之庭於此之時仙道已成稽首大羅元始玉清昊天玉皇三景天尊不可以見唯覩祥雲玉童傳勑彷彿可聽賜汝丹藥金珮珠纓汝如得之禮拜舞抃自有真仙教汝朝見此經真妙故說其略心宜存思慎无乖錯念念真經神官賜藥上受天爵行淺屍解篇第八末學道淺屍解昇仙於未死時必有善縁塵劫已盡東岳落籍西岳落名社令神君中有二使追引魂神汝於此時長記汝因旣見冥官冥關之庭中有刑獄可畏可驚汝无畏懼直述汝情道其縁由无隱實誠惡簿无姓善簿有名中有東極救苦真人問汝好辭歡喜而迎同上玉輿𨍸軿四輪左右之神一如昇真當識其姓當識其名送汝神魂受錬朱陵次第階列逍遥上昇登天之門入紫微庭或有丹藥或有真經玉童傳詔一似飛昇汝之骸骨塊然遺形如蛇蟬之蛻臭腐而馨曰子曰孫葬以盡誠蓋遺恩愛未易離人習氣尚爾時歸一臨子孫啼哭不見子形子於此時未能忘情當以塵寰是念不入幽冥不受埃塵割情捨愛立汝道基爾子爾孫或得頼之仙超蒙廕亦昇仙梯仙梯在目而人不知列班昇籍篇第九屍解雲昇同道異路皆曰超凡名書真簿或有在生遥授或因死後超注遥授而不超注者有矣未有超注而无遥授者也有在天樞吏職有在天樞鋪陳各有入等出无上始青中有所載中有所名上品以孝中品錬形下品救度皆出世塵元綱流演自然列班昇籍記名簡而不繁左右二司太妙禁壇中有近禁紫微青壇中有要地金闕赤壇三清侍臣左右之丞三十二天亦有上相為有寰局文武之官文武之勲大使微使使名雜使真人統軍六職十二上帝加恩各有秘字以少為貴其言不華切當爾心不能疵瑕雲車雲馬三清之家如玉就琢如金去鑛可以陶成器類不就毀斥者也諸名上仙仙位之列文武有籍自然分别太上簡易不必紙墨念念真經心不生惑魂神旣熟自然有得列班入等篇第十人有先後上學通真中學積行下學箸功或為九宮清職或作下位吏貟補任以力名在諸軍三天河源六府吏兵不論強劣男子女人念念隨縁得此勝因玉童光顯上等女人其在下者亦作女兵有自然藝有自然靈善因學起學以戒成初修戒慎无為力役習此文藝積其諸德在生所學死後之力雲路列班幽冥授職各遂其長自然无惑其上有善不能而能不識而識不知而知十善之力是以或虚淡然自養名在散官上帝符下委事看詳或列禁近或作冗官或為玉童晨極帝房或為典者奔走殿廊有作力士甲盾生光上將軍位統兵作行或作將軍主掌或作卒伍之郷八九福地六六洞天河海山岳皆有其名隨功而受毫髮无私天樞典籍都録主事稽考出入百事不違成道志學篇第十一成道之人亦當志學不私不曲不犯邪欲有一念之冥官考戮天憲神機本自幽微堅固其形无蕩无遺保其長命不墮塵世塵世之人帝王之身百僚貴戚以及農人凡在下界亦各有因隨業以受或貴或貧或賤或富不出于心諸天之神亦即世人世人學道即為天神天神失學復責世塵學以不墮守戒能循五十萬劫天蓬尊神二十四劫真武將軍一千萬劫救苦真人一十五劫日直元君此非化身世上之人死而為神仙而上昇天官記姓地官録名水官記功天樞都府録其官爵有功无過經劫不落三元考第名在異等玉皇之命髙其德行如此大仙多不可記畧舉一二以述吾意凡我後學志學无替天中有文天中有籍可以興功可以贖罪𦍒有鎡基母或自棄餓鬼畜生各非其異類亦各本人罪犯而致地獄天獄不可輕視天道祕書篇第十二凡學上仙必知所止天中隱名天中隱字太上三清空同赤耳玉皇紫微致逺仲智南北二斗三台所記子辛子寅庚戊丁壬子癸之神孟叔孟良仲寳仲卿季玉季乾是乃二庭三台之中雲育齊景奉良請乞四聖神君太陽太隂日月尊星其名晅朒五行之神是亦别稱水星名衍火星名熒木星名苖金星名堅土星名鎮重領諸權二十八宿三十二天㳟華揺伯楊琯倘玄目局紫臺阿那洞玄亶法長駕職後衮騰砂劫那醜回貟陽邅此其隱名字載度人諸宗立鞠傳統魁輪喬資羙禁首善特靈岳什寳駕逢慮注延稗捧德淑此其經星五星緯列有其化身天樞之主是謂道陵該括地象皆是主首五岳四瀆皆有其機具列靈書念之消災百鬼所畏沙河人名不出其紀靈書上品篇第十三怛他蘇伽俱知瑟尼勃地鞞弊娑合囉婆迦喃盧雞波那羯唎陀彌底提離瑟勃𧹞悉多毗地奴抄訶帝野拏盤遮三慕般剌悉泥毗俱茶輸西那曳都翳曇揚岐羅㕹囉比計陀你利般唎耶儜莬㘕懴囉都嚧虚遮瞻婆那它麽䅋䅋多罔迦毗剌那槃遮摩地扇遮波刹那啒補稚視多拏虎𤙖嚧雍波瑟悉地騰崩伽梵阿弊跋夜茶余闍夜檐訖埵彌泮吒弊乂演吉合曳乾曳乾質閉㘑藥叉烏什伐羅輸藍質多地栗剌吒瑟質夜那夜波沙提甕莎尼釤那倶只他嚧呼嗚唵句底那羅刀底刹那雲風居那合蘇嚕那曇迦青那彌嚧合耶青莫嚧牯伴居訶耶悉但頼耆彌唎婆訶靈書下品篇第十四軌糜享釤跢掲毖𧹞剌飄嚂吒赭儜啒莬掘𤙖甖粹嵩堙昵辮樺詛𥕺天刳蠢蠕蝦梟塊胤缺累鑚陷涎複䝘濫攪忤悃鶴鉞撾戮促摝𧎥愗餒矟潰士魃愗磑魘蠱俍誣殫熠樞紐灣㜸綴秉岐妓霰𥚚驅邪割暴忿坦毳涎靴揖詈誅咄怛吽嚩宻羅婆訶唵户盧尾引摩怛他刀唎本蜆魁鬼歆呵飄籠矟那謹謹沙那銅蛇蝎那風輪火車帝居怛訶風火交加梵翳微銷九梁橫梟揖巵泄誅靴詃弦訶詈奸吽嚩只知那怛唎拏加三炁陀羅帝利蛇闍雲目帝那吠伽婆帝翳婆伽多只岐囉撾毗只知他翳帝夷帝羅义底南喝喝刹娑雞利女訶風輪火車靈書釋梵篇第十五太上混沌中有神仙神仙之中諸位大仙森羅列宿四象周貟本在人世修習真詮赫然成功忽爾飛騰天帝命官賜之几筵上帝賜名靈書隱玄靈書之紀仙之主司怛他蘇伽是為其先念之一篇解釋惡縁聞汝呼召一時至前或乃雲衣彷彿或即玉佩鏗然或有道士或有官貟或作力士或作虎賁護爾念經經義甚玄玄之又玄閉目静思三十二天昇真識神魂魄旣熟自然入局我有寳圖後有寳籙有能行此自然道足錬形之方修真之術救人之藥教人之福本乎孝弟以至輔翼天中之光天中之精天中之丹天中之英行此而後汝可得之誦之萬遍身在南宫名聞上帝乗風馭空翛然徃來或西或東有諸後學願聽而從圖書可入篇第十六諸學仙童必知凝神凝神謂何變化身形可以錬養自然昇真昇真謂何必乃識神何以識神得我寳圖元炁之本流演之綱昇仙之藥昇仙之方得之云何何為之因何為之因孝弟六親能孝弟者可行吾書吾書非常上帝之符帶符歩圖忽然乗虚日月之華五星之精合而為丹以養汝形日月之銳五星之鋒鑄而為劍以保汝身身形旣固以安性命復有靈符可以辟鬼鬼邪不侵道已成矣用救下民用超生死天中之官天中之職天中之衣天中之食耳有仙藥目有仙花逍遥上天三清之家中有定官中有近臣天中之尊天中之神天中之職得而列名諸學仙童无敗吾教謹而行之修吾至道如有善人學以質心盟書黄金祝於神明无妄付人妙有寳圖篇第十七何為寳圖昇真機關背南面北存作星壇壇髙為何九尺有二日月左右二斗前後華蓋在上復有朱雀白虎青龍玄武同一乾坤艮巽列位无差存神馭炁搯彼卯文身衣法服如所度籙直詣人門丁罡而入丁罡三歩升一級壇自壇左行念吾神呪直向地户復亦左行念吾神呪直入天門入天之門如有仙人仙人二人玉童玉女侍香傳言以度於汝長跪閉目若有神人乗五色雲服衣上清傳玉帝符呼子之名復有一人執彼瑶爵瑶爵之中有玉霞漿北斗之中有一黒炁南斗之中有一赤炁日月之中有彼紅炁有彼白炁華蓋之中有五色炁流入杯中汝能受之再拜而飲放訣下壇右旋而出出念吾呪自然有益庚申甲子三元三㑹勤而行之則元綱流演之括祕也太上靈寳淨明洞神上品經卷上
