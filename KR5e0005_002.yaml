front:
  text: 太上靈寶淨明洞神上品經卷下奉二
  hash: sha256:33b3a30a1ae2dcc6b61f42ded197f40602043f2456282f5009f037e64676b36d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5e0005_HFL_002-001a, image: hfl/0756/0756-038.png}
body:
  text: 佩服寶籙篇第十八天尊救世人佩籙行流綱升壇三級後得復飲霞漿下壇右轉出步斗成魁魒六星覆其頭回身入斗口行行步無色歷箕旋斗罡回度五常訖悠然之帝鄉遂見金闕尊吾巳遊十方去天受天爵魂魄自然安欲知吾寶圖二篇故可見欲知吾寶籙寶籙有真訣取彼玉皇文望斗書丹砂每於甲子日篆之於其家一日服一道自然生津華佩之不可捨可以成仙家仙家固非遙元綱可升遐天地户呪篇第十九誰能學仙學仙有方仙方非難在吾寶圖佩籙行圖自有神護前有寶籙可以吞服佩之云何依彼法術燒香存壇壇髙巍巍上壇請神下壇步罡凡人之魂必有祕呪呪之云何日存地户念彼呪曰仙道渺莾元始之家我欲升壇清神變慮願得太上賜我流霞流霞之漿布氣芬芳我得服之可以步罡五藏神君直日香官聞吾祕呪亦各以安後入天門亦有祕呪無上大羅大羅玉清玉清之宫度法真人聞吾祕呪度我尸形取彼玉霞以淨我神我今步罡行之帝鄉行之帝鄉上謁玉皇後念祕呪以下星壇其呪有在二篇靈書靈書之中百神之名三十二天二十五分主宰之神皆來奉迎引子之神以周以旋上到金闕乃無上玄召神品篇第二十淨明之經諸法之宗行之有道役使鬼神去病除禍召雨行雲以出生死以救萬民行持寶圖佩籙行罡道滿功成名在帝鄉何神不從何鬼不藏有都元帥有都使者有曰外壇有曰內壇內外之壇統三十六將捉鬼枷鬼縳鬼考鬼蓬頭藥叉牢頭黃頭有曰火輪四方威德靈官五郎十二藥叉有曰遊奕有曰照捉有曰急捉有曰追魂如此之將各有副將乾元亨利圖叉郭天召彼生魂及彼死魂回有雷車又有雷部各有天樞之節制有在天罡之所部用之之法各有呼召各有呼召聲隨氣至氣與神交自然見前可以役使天將吏兵各有貟數夢寢報應不失時刻此所謂三五飛步洞神役使鬼神之要術也三五飛步篇第二十一三五飛步流綱之總天英天任天柱天心天禽天輔天衝天內達于天蓬是為七變上應於天如彼元綱亦其至妙三台六步出自斗口七七之數左環成火是謂正真東行九九以成太陽八八西行是謂太隂右旋復左左復右行凡及七反左行向東以歷十方十方之星二十八宿每宿丁罡一十有二自箕旋斗旋斗入箕直望大魒左旋南向四十九步是謂交鋒重犯火星經於太隂六六之步成於水宿由水東行至於太陽之側左行成木六十四步再回而行是為無英公子犯水借罡復出月傍以為金星白元尊神細行而至中達于斗口三十五步以成于土由土總氣借金之罡還于水宿入于木辰凡望于北八步八景以朝天闕而三五之法特其要略推而大之則其記數不過于三五之數如是則可召諸神而使之矣朝天見帝篇第二十二天英八景皆曰朝天三清上帝紫微昊天叩齒五通咸在目前無所不白無所不言此所謂之以步斗朝天可以治病救禍可以養真修行可以全吾至孝可以役使鬼神天蓬四聖諸位真人莫不奉迎於此之時天有靈丹左得七縛以為日君右得七煞以為月君吞咽呼吸是為真丹有竒有耦有陽有隂隂陽之丹服之長生或得長命尸解成真或能洞視細考百靈天中之訣天中之經天中之官天中之職各得於身非必師授出於天成天成云何朝天之法可以妙入無上而自逹於始青於此之時十天魔王長生大神五方真帝衛護身形如彼日月久而愈明如彼五行輪轉不停或得父母升天子孫福廕實所謂氣入玄玄者也修功成實篇第二十三孰不欲得仙學仙於少年少年事忠孝積久成善根復以氣血完升降在丹田持符救人病隂德可超然修行用吾法何憂不升天吾有淨明經誦之學忠孝兼以錬形質神明來贊助遂可治百病於此興元功可以致仙域脫彼煩惱門入于清明界乘彼玄鶴雲自然飛凌空其欲使鬼神乃如童僕從六甲與六丁此法出其宗修功但成實以此相磨礲自然得吾法百日見鬼神何以助上帝遣以來助汝汝善能奉道其或諸妖魔亦欲朝於汝蓋由忠孝質仍以真氣全有功在群品位列于仙班不能行此道得法必須難縱然得吾法此術必不靈忠孝匪在心氣血因利喪仙道日愈逺得法如蒸砂蒸砂以作飯勞力不可熟既有火氣熱熱以不可食南宫諸上仙未聞一不孝行孝以學仙學仙當易成褒崇祕格篇第二十四上帝列職諸天之官天官真職各有其妙由其所學故奬以祕字合為佳稱用成上道順事二親之謂孝敬事君主之謂忠和于兄友之謂弟睦于親族之謂和養于性命之謂真達于教典之謂道勤於正心之謂德役使鬼神之謂聖克於至聖之謂神明于見聞之謂慧慧而發揚之謂靈德行不變之謂定定而不變之謂應勤奉道法之謂恭守於戒律之謂行德足發揚之謂顯顯而不渝之謂光光輝甚盛之謂哲魂魄受錬之謂白役使無私之謂毅多收靈書之謂會質而可用之謂文德行不邪之謂徵兼愛不倦之謂仁美而可嘉之謂休有諸善緣之謂果欽敬不倦之謂肅凡此之類或以千千或以萬萬具在典籍諸學道者勤而行之則褒崇祕格有自而入也律真機篇第二十五玉律真要紫庭鬼青有自然義有自然明勤修正教大道乃成昧而顛迷惡貫自盈清淨不汚之謂潔戒慎憂懼之謂勤欲而未得之謂真欲貪而未得之謂真貪取不取盜非盜淫非淫逆非逆順非順順逆逆順善惡惡善悔悟學道謂之上善矯情非道謂之大惡生非其生殺非其殺掩善為弊隱惡為欺殺欲其生此其好生見之欲殺此名好殺怨父母者不可得生雖生可殺故真孝者不死至孝者得仙仙道易鬼道難善人之常惡人之僞善本善習使成惡惡非惡攺即為善故泄慢受賞祕收蒙戮以僞勸善曰信以誠文過為欺隂過大陽過小發於內而不露者罪已重為於外而有愧者罪巳釋無抑人善㧕人善者背道雖奪人好奪人好者向道天光發地火照人光鑒可以知也洞識生前篇第二十六明真不昧洞識生前得其宿習以成善根無舛無錯以學神仙仙道云何靈性所至惟可洞識乃臻玄科玄科甚明見吾舊學與彼舊學既可再犯既可再致自然成真成真非難學而後至永劫不易真識不迷是為洞識由彼洞識達于洞神由彼洞神故能洞視謂之洞者幽明悉察明暗罔移是謂上智飛神三五遊宴諸天諸天之上各有真人真人之術其義甚明滌其臟腑養其精神自然之藥符呪甚靈有彼天鼓擊之甚鳴有彼玉泉取之而盈玉泉之來華池之津其旨如蜜其味最真咽漱鳴鼓六六而畢以存吾神浴月洗日日月既朗天地以明萬象開闢神魂超然此明洞視以察鬼神可以燭萬里可以照一身鬼神所護達於微冥回生起死篇第二十七唾易修摩撫氣合神五天大魔萬神之宗召之以還中有真人保命生根收引魂神還其宅宇不蕩不搖制之不散枯木再華混沌冥合總於泥丸泥九之中通於絳宫絳宫之神還即返真是以枯骨可以更生皆起而成人方是之時有曰魔泥有曰法宗有曰還真有曰懵愡有曰鬱羅為五天之使是為趙孟吳使飛魂騰魄之鬼召之有訣使之有方為一身之總領而度死之法王又有正氣布于內外內外既浹達于關節不蕩不搖忽然自得即說呪曰回生真人救苦真人唾易修摩總氣合神魂魄再返死籙脫名五天大魔度其尸形使某甲再生急急如律令若夫訣目關節存在祕書復遇緣合之人即得受持也幽都考形篇第二十八酆都之山有牢有獄有大帝君主判其獄萬千羅魔考伐邪鬼百千萬死死而又生經劫輪轉方作六畜問其何因皆以不孝不孝五逆上根於心心愚不悛旋以不弟不弟不孝變為不忠貪財貪色貪酒貪淫以是因緣變生多故干犯隂陽觸忤天地十二時辰録其罪犯上達天庭天庭行下付于天樞繫其魂神死後入于酆都有能念此經罪惡自消除念經行孝弟攺行悔終𥘉得為神仙人自然升天衢天衢自難升行之有祕法祕法不難求行孝自然至當㑹明達人悟汝以法意㑹曉勉力行即脫酆都行不持釋奮犯可贖祖考魂順心行孝弟不必念此經此經悔愚昧用以度沈淪願我諸仙童孝弟不離心淨明正印篇第二十九淨明諸法總終始四十篇以孝為祖以身為宗唯孝可以學於此升天宫天宫本在目由我法不行念此淨明經兼行淨明法法可消千災兼治萬魔精功滿自圓成千劫不喪身堂有百年翁家內無偏親仍有白髮孫戲笑於中庭此總元氣入于玄玄玄中之科三十五分復有妙說靈書二篇可以夀千百可以見鬼神可以鑄金玉可以召風雨可以救亡魂可以消兵革唯以堅守吾教念吾此經自有神仙以此三篇教汝諷誦讀之即能成上真也真人非難學學之先以孝孝弟非難行順事父母心父母本天尊汝其悟於心淨明靈寶符篇第三十念我淨明經復行淨明法可以先行孝次學錬身形身形既以安正氣攝百鬼救護諸衆生可以成功勳功勳非難積善學淨明經淨明有寶符訣目甚分明中有靈寶尊靈寶大真人天樞都録事日直太元君掌法行祕科行之自然靈復有大神將十天大魔王四聖大將軍內外十六將四直直符吏為子行靈符為子興功藝不孝行此法如彼雪投湯罪犯自消釋不孝變孝誠孝誠成第一復能救世人功績著上天仙道自然成欲知行孝人復念淨明經行此淨明法如龍足生雲龍足既生雲風雷皆汝御淨明寶符靈度脫六親篇第三十一前一道符如有人能受持於父母六親本命之日用朱砂書符恰訣存身為孝道明王念呪書符與其人吞服自然父母六親長夀後一道符如有人能受持於父母六親身死之日用朱砂書符恰訣存身為孝道明王念呪書符燒化和泥置於亡者心上即亡者託此法力回生起死魂魄受生自然超度已上二符能至力行持即道果有基方可修錬服氣又逐日書符各一道燒則生者蒙福死者得仙矣永為生死解脫之本也服錬身形篇第三十二前一道符可以飛升天耳第二道符可以開明天目天目天耳達乎泥九則服錬身形之要法所謂化生諸天有能恰訣念呪書符二道每日朱砂寫而吞之則日月五星之真氣注身也服之不飢自然長生寫時存為孝道明王靈寶淨明天尊則天尊降真氣存于汝身也救治百病篇第三十三前一道回死為生後一道保命生根凡有疾病者閉目靜思取朱砂恰訣念呪存身為孝道明王靈寶淨明救苦天尊丸符呪水以服之則病者自安救治疾病謂之道力以力行道謂之細積以法行道謂之逹道以孝行道謂之上道道有上中下三品此其下也然救治百病愈人疾苦亦可得仙諸行孝服氣功已圓矣得此則行孝錬氣之羽翼也束縛百邪篇第三十四右符束縛百邪凡有壇廟五通作怪之物為民害如門户開闔塘池破壞皆急取此符念呪恰訣朱書鎮貼即自消散書呪符篆之時面北存身為孝道明王靈寶淨明天尊四聖執符而行安鎮呼召篇第三十五凡一切呼召風雷社令天地一切鬼神書符燒之七日即至如欲禳謝用大石書符埋之此太上孝道明王靈寶淨明天尊祕篆凡書符存身為其本像自有靈書三卷得遇至人傳授太上靈寶淨明洞神上品經卷下
