body:
  text: 无上始青篇第一天官列次篇第二入道真品篇第三入道修己篇第四修己奉教篇第五奉教修真篇第六昇真識神篇第七行淺屍假篇第八列班昇籍篇第九列班入等篇第十成道志學篇第十一天道祕書篇第十二靈書上品篇第十三靈書下品篇第十四靈書𥼶梵篇第十五圖書可入篇第十六妙有寳圖篇第十七卷下佩服寳籙篇第十八天地户呪篇第十九召神品篇第二十三五飛歩篇第二十一朝天見帝篇第二十二修功成實篇第二十三褒崇祕格篇第二十四玉律真機篇第二十五洞識生前篇第二十六廻生起死篇第二十七幽都考形篇第二十八淨明正印篇第二十九淨明靈寳符篇第三十度脫六親篇第三十一服錬身形篇第三十二救治百病篇第三十三束縛百邪篇第三十四安鎮呼召篇第三十五
